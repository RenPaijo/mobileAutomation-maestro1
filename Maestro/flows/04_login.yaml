appId: com.saucelabs.mydemoapp.android
name: 04 - Login
---
- runFlow: helpers/launch_app.yaml

- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 15000

# Reach the Login screen via cart -> checkout (tap gambar produk: judul teks tidak clickable)
- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/productIV"
    index: 0

- extendedWaitUntil:
    visible: ".*Add.*[Cc]art.*"
    timeout: 10000

- tapOn: ".*Add.*[Cc]art.*"

- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/cartIV"

- extendedWaitUntil:
    visible: ".*Proceed.*Checkout.*"
    timeout: 10000

- tapOn: ".*Proceed.*Checkout.*"

# Reusable login step (credentials via LOGIN_USER / LOGIN_PASS env)
- runFlow: helpers/login.yaml

# Successful login leaves the Login screen and continues checkout
- extendedWaitUntil:
    visible: ".*Checkout.*|.*Address.*|.*Shipping.*"
    timeout: 15000

- assertVisible: ".*Checkout.*|.*Address.*|.*Shipping.*"

- takeScreenshot: 04_login_success
