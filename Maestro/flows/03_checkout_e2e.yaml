appId: com.saucelabs.mydemoapp.android
name: 03 - Checkout E2E
---
- runFlow: helpers/launch_app.yaml

- extendedWaitUntil:
    visible: "Sauce Labs Backpack"
    timeout: 15000

- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/productIV"
    index: 0

- extendedWaitUntil:
    visible: ".*Add.*[Cc]art.*"
    timeout: 10000

- tapOn: ".*Add.*[Cc]art.*"

- tapOn:
    id: "com.saucelabs.mydemoapp.android:id/cartIV"

- extendedWaitUntil:
    visible: ".*Proceed.*Checkout.*"
    timeout: 10000

- tapOn: ".*Proceed.*Checkout.*"

# Login via reusable helper (credentials via LOGIN_USER / LOGIN_PASS env)
- runFlow: helpers/login.yaml

# Checkout - Address
- extendedWaitUntil:
    visible: ".*Checkout.*|.*Address.*|.*Shipping.*"
    timeout: 15000

- takeScreenshot: 03_checkout_started
