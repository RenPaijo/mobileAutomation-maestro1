name: Maestro Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # nightly 08:00 WIB

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION="2.10.0"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run on Maestro Cloud
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          if [ -z "$MAESTRO_CLOUD_API_KEY" ]; then
            echo "::error::Secret MAESTRO_CLOUD_API_KEY belum diset (Settings > Secrets > Actions)"
            exit 1
          fi
          # Only pass --projectId when the optional secret is set.
          PROJECT_ID_ARG=""
          if [ -n "${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}" ]; then
            PROJECT_ID_ARG="--projectId ${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}"
          fi
          maestro cloud \
            --apiKey "$MAESTRO_CLOUD_API_KEY" \
            --app-file Maestro/apps/mda-2.2.0-25.apk \
            --flows Maestro/flows \
            $PROJECT_ID_ARG \
            --name "andro_1 ${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --commitSha "${{ github.sha }}" \
            --repoOwner "${{ github.repository_owner }}" \
            --repoName "${{ github.event.repository.name }}" \
            --format JUNIT \
            --output report-cloud.xml

      - name: Convert JUnit to Allure results
        if: always()
        run: |
          python3 tools/maestro_junit_to_allure.py \
            --junit report-cloud.xml \
            --out allure-results \
            --env "branch=${{ github.ref_name }}" \
            --env "commit=${{ github.sha }}" \
            --env "target=Maestro Cloud" \
            --executor-name "GitHub Actions" \
            --executor-type github \
            --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --build-name "maestro-cloud #${{ github.run_number }}"

      - name: Setup Node for Allure CLI
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: Upload Cloud reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-cloud-allure-report
          path: |
            report-cloud.xml
            allure-results/
            allure-report/
          if-no-files-found: warn
