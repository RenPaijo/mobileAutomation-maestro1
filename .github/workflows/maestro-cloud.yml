name: Maestro Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # nightly 08:00 WIB

jobs:
  maestro-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run on Maestro Cloud
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          if [ -z "$MAESTRO_CLOUD_API_KEY" ]; then
            echo "::error::Secret MAESTRO_CLOUD_API_KEY belum diset (Settings > Secrets > Actions)"
            exit 1
          fi
          maestro cloud \
            --apiKey "$MAESTRO_CLOUD_API_KEY" \
            --app-file Maestro/apps/mda-2.2.0-25.apk \
            --flows Maestro/flows \
            --projectId "${{ secrets.MAESTRO_CLOUD_PROJECT_ID }}" \
            --name "andro_1 ${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --commitSha "${{ github.sha }}" \
            --repoOwner "${{ github.repository_owner }}" \
            --repoName "${{ github.event.repository.name }}" \
            --format JUNIT \
            --output report-cloud.xml

      - name: Upload Cloud report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-cloud-report
          path: report-cloud.xml
          if-no-files-found: warn
